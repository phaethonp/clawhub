# Urbicana's checks for the fork (phaethonp/clawhub). ClawHub's own
# workflows are disabled on the fork (urbicana/SYNC.md); this one runs the
# brand check, the type check of urbicana/ and a production build on every
# push to the urbicana branch. No secrets: the build points ClawHub's Convex
# addresses at nothing, as development does.
name: Urbicana

on:
  push:
    branches: [urbicana]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Brand check
        run: bun urbicana/check.ts
      - name: Type check urbicana/
        run: bunx tsc -p urbicana/tsconfig.json
      - name: Production build
        env:
          VITE_CONVEX_URL: https://example.invalid
          VITE_CONVEX_SITE_URL: https://example.invalid
          VITE_SITE_URL: https://hub.urbicana.com
        run: |
          bun run llms:generate
          node ./node_modules/.bin/vite build --config urbicana/vite.config.ts
      - name: Build output carries Urbicana's files
        run: |
          cmp urbicana/public/logo-transparent.png .output/public/logo-transparent.png
          cmp urbicana/public/clawd-mark.png .output/server/clawd-mark.png
          test ! -e .output/public/llms.txt
          test ! -e .output/public/.well-known/clawhub.json
